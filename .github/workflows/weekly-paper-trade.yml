# Runs weekly paper accounts after the Friday US cash close.
#
# Goal: rebalance only once per week (Friday), after 6 PM Eastern, matching the
# DM42 backtest cadence. GitHub cron is UTC-only and often starts late, so:
#   - one cron at Friday 23:00 UTC = 6 PM EST (winter) / 7 PM EDT (summer) —
#     always at or after 6 PM Eastern year-round (no second cron that double-fires)
#   - guard requires Friday after 6 PM ET, or Saturday before noon ET if Actions
#     queues the Friday job past midnight; manual workflow_dispatch always runs
#
# Do not add weekly books to daily-trade.yml — mid-week rebalances diverge from
# the research. Live money uses a separate workflow with --confirm-live.
name: weekly-paper-trade

on:
  schedule:
    - cron: "0 23 * * 5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        account: [paper_dm42]
    concurrency:
      group: weekly-paper-trade-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check Friday after 6 PM Eastern (or Saturday morning grace)
        id: guard
        run: |
          tz="America/New_York"
          hour=$(TZ=$tz date +%H)
          # Strip leading zero so 08 is not octal; hour is 00-23.
          hour=$((10#$hour))
          dow=$(TZ=$tz date +%u)   # 1=Mon ... 5=Fri 6=Sat
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (workflow_dispatch)."
          elif [ "$hour" -ge 18 ] && [ "$dow" -eq 5 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (Friday after 6 PM ET; hour=$hour)."
          elif [ "$dow" -eq 6 ] && [ "$hour" -lt 12 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (late Friday cron slipped into Saturday morning ET; hour=$hour)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping (event=${{ github.event_name }}, ET dow=$dow hour=$hour)."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install poetry
          poetry install --no-interaction

      # DD-brake peak equity lives in live/state/<account>.json (gitignored).
      # Restore/save across runs so the brake is not reset every Friday.
      - name: Restore strategy state
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: live/state
          key: live-state-${{ matrix.account }}-${{ github.run_id }}
          restore-keys: |
            live-state-${{ matrix.account }}-

      - name: Run trading engine
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_PAPER_DM42_KEY: ${{ secrets.ALPACA_PAPER_DM42_KEY }}
          ALPACA_PAPER_DM42_SECRET: ${{ secrets.ALPACA_PAPER_DM42_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: poetry run python live/run.py --account ${{ matrix.account }}

      - name: Save strategy state
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: live/state
          key: live-state-${{ matrix.account }}-${{ github.run_id }}

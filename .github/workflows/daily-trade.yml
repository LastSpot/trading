# Runs named paper accounts at 6 PM Eastern every weekday.
#
# GitHub cron is UTC and does not follow US daylight saving, so two crons are
# scheduled (22:00 UTC = 6 PM EDT, 23:00 UTC = 6 PM EST) and a guard step lets
# only the one that lands on 6 PM in New York proceed. Manual dispatch always
# runs.
#
# Add another paper book by appending its id to matrix.account and wiring its
# ALPACA_PAPER_* secrets. Live money uses a separate workflow with --confirm-live.
name: daily-paper-trade

on:
  schedule:
    - cron: "0 22 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        account: [paper_r50d]
        # add paper_r50tilt, etc. later
    concurrency:
      group: daily-paper-trade-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check it is 6 PM Eastern (skip the off-DST cron)
        id: guard
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 6 PM ET (hour=$hour) -- skipping duplicate DST cron."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run trading engine
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_PAPER_R50D_KEY: ${{ secrets.ALPACA_PAPER_R50D_KEY }}
          ALPACA_PAPER_R50D_SECRET: ${{ secrets.ALPACA_PAPER_R50D_SECRET }}
          # Soft cutover: legacy names still work for paper_r50d until rotated
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: poetry run python live/run.py --account ${{ matrix.account }}

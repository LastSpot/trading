# Runs named paper accounts after 6 PM Eastern every weekday.
#
# Goal: trade only after the US cash close, with a 6 PM ET floor (buffer past
# 4 PM close). GitHub cron is UTC-only and often starts late, so:
#   - one cron at 23:00 UTC = 6 PM EST (winter) / 7 PM EDT (summer) — always
#     at or after 6 PM Eastern year-round (no second cron that double-fires)
#   - guard requires New York hour >= 18 so a delayed runner still trades;
#     manual workflow_dispatch always runs
#
# Add another paper book by appending its id to matrix.account and wiring its
# ALPACA_PAPER_* secrets. Live money uses a separate workflow with --confirm-live.
name: daily-paper-trade

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        account: [paper_r50d]
        # add paper_r50tilt, etc. later
    concurrency:
      group: daily-paper-trade-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check it is after 6 PM Eastern
        id: guard
        run: |
          hour=$(TZ=America/New_York date +%H)
          # Strip leading zero so 08 is not octal; hour is 00-23.
          hour=$((10#$hour))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" -ge 18 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (event=${{ github.event_name }}, ET hour=$hour)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Before 6 PM ET (hour=$hour) -- skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run trading engine
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_PAPER_R50D_KEY: ${{ secrets.ALPACA_PAPER_R50D_KEY }}
          ALPACA_PAPER_R50D_SECRET: ${{ secrets.ALPACA_PAPER_R50D_SECRET }}
          # Soft cutover: legacy names still work for paper_r50d until rotated
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: poetry run python live/run.py --account ${{ matrix.account }}

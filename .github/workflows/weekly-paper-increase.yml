# Completes cash-rotate weekly rebalances after Monday's open.
#
# Friday weekly-paper-trade.yml submits sells/exits only. This job submits the
# matching buys once reduce orders have filled and freed buying power — the
# live equivalent of the research atomic Friday-close -> next-session rebalance.
#
# Cron 14:35 UTC = 9:35 AM EST / 10:35 AM EDT (always after the 9:30 ET open).
# Guard requires Monday after 9:30 ET, or Tuesday before noon ET if Actions
# queues the Monday job past midnight; manual workflow_dispatch always runs.
name: weekly-paper-increase

on:
  schedule:
    - cron: "35 14 * * 1"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        account: [paper_dm42]
    concurrency:
      group: weekly-paper-trade-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check Monday after cash open (or Tuesday morning grace)
        id: guard
        run: |
          tz="America/New_York"
          hour=$(TZ=$tz date +%H)
          hour=$((10#$hour))
          minute=$(TZ=$tz date +%M)
          minute=$((10#$minute))
          dow=$(TZ=$tz date +%u)   # 1=Mon ... 7=Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (workflow_dispatch)."
          elif [ "$dow" -eq 1 ] && { [ "$hour" -gt 9 ] || { [ "$hour" -eq 9 ] && [ "$minute" -ge 30 ]; }; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (Monday after 9:30 ET; hour=$hour minute=$minute)."
          elif [ "$dow" -eq 2 ] && [ "$hour" -lt 12 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (late Monday cron slipped into Tuesday morning ET; hour=$hour)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping (event=${{ github.event_name }}, ET dow=$dow hour=$hour minute=$minute)."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Restore strategy state
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: live/state
          key: live-state-${{ matrix.account }}-${{ github.run_id }}
          restore-keys: |
            live-state-${{ matrix.account }}-

      - name: Run increase phase
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_PAPER_DM42_KEY: ${{ secrets.ALPACA_PAPER_DM42_KEY }}
          ALPACA_PAPER_DM42_SECRET: ${{ secrets.ALPACA_PAPER_DM42_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: poetry run python live/run.py --account ${{ matrix.account }} --phase increase

      - name: Save strategy state
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: live/state
          key: live-state-${{ matrix.account }}-${{ github.run_id }}
